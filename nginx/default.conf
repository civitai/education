# Served in-cluster by nginx (see Dockerfile). Replaces public/_headers and public/_redirects, which only
# Cloudflare Pages reads; scripts/build-nginx-conf.mjs turns _redirects and wp-ids.json into the includes.
include /etc/nginx/education/maps.conf;

# Only the real host is indexable; education-new and any other name stay out of search.
map $host $robots_tag {
    education.civitai.com "";
    default "noindex";
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    absolute_redirect off;

    # An empty value sends no header.
    add_header X-Robots-Tag $robots_tag always;

    # WordPress shortlinks: /?p=123 and /?page_id=123.
    if ($wp_p_target != "") { return 301 $wp_p_target; }
    if ($wp_page_id_target != "") { return 301 $wp_page_id_target; }

    include /etc/nginx/education/redirects.conf;

    # WordPress search links (/?s=term) go to the Pagefind page, which reads ?s=.
    location = / {
        if ($arg_s != "") { return 301 /search/?s=$arg_s; }
        # A shortlink id WordPress no longer has (known ids returned 301 above): 404, as WordPress did.
        if ($arg_p != "") { return 404; }
        if ($arg_page_id != "") { return 404; }
        try_files /index.html =404;
    }

    # Astro emits directory indexes (/path/ -> /path/index.html).
    location / {
        try_files $uri $uri/ =404;
    }

    # Feeds are served from <path>/feed/index.html; give them their real type.
    location ~ ^/(feed|category/[^/]+/feed|tag/[^/]+/feed|author/[^/]+/feed)/$ {
        default_type application/rss+xml;
        types { }
        charset UTF-8;
        add_header X-Robots-Tag "noindex" always;
        try_files $uri/index.html =404;
    }

    location ~ ^/_(headers|redirects)$ { return 404; }

    # WordPress media lives in the repo (public/wp-content/), most of it converted to WebP; old URLs
    # 301 to the new names (src/data/media-renames.json). Files kept out of the image (.dockerignore:
    # the Git LFS ones) fall through to the B2 copy.
    location /wp-content/ {
        if ($media_rename != "") { return 301 $media_rename; }
        try_files $uri @b2_media;
    }
    location @b2_media {
        # A named location's proxy_pass takes no URI part, so the bucket prefix goes on by rewrite.
        rewrite ^ /file/civitai-education-media$uri break;
        proxy_pass https://f004.backblazeb2.com;
        proxy_set_header Host f004.backblazeb2.com;
        proxy_ssl_server_name on;
        proxy_hide_header x-bz-file-id;
        proxy_hide_header x-bz-file-name;
        proxy_hide_header x-bz-content-sha1;
        proxy_hide_header x-bz-upload-timestamp;
        proxy_hide_header x-bz-info-src_last_modified_millis;
        proxy_intercept_errors on;
    }

    # Former VideoPress videos (src/data/videopress.json). They are in the repo as Git LFS files, which
    # the image build can't fetch, so the site serves the same files from the B2 bucket.
    location /videos/ {
        proxy_pass https://f004.backblazeb2.com/file/civitai-education-media/videos/;
        proxy_set_header Host f004.backblazeb2.com;
        proxy_ssl_server_name on;
        proxy_hide_header x-bz-file-id;
        proxy_hide_header x-bz-file-name;
        proxy_hide_header x-bz-content-sha1;
        proxy_hide_header x-bz-upload-timestamp;
        proxy_hide_header x-bz-info-src_last_modified_millis;
        proxy_intercept_errors on;
    }

    location = /healthz {
        default_type text/plain;
        add_header X-Robots-Tag "noindex" always;
        return 200 "ok\n";
    }

    error_page 404 /404.html;
}
